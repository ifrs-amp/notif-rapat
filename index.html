<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Jadwal Rapat</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background-color: #ffffff; width: 100%; max-width: 500px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #333; font-size: 20px; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; border-left: 3px solid #4a86e8; padding-left: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #444; font-size: 14px; }
    label span { color: #e74c3c; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    input:focus, textarea:focus { border-color: #4a86e8; outline: none; }
    textarea { resize: vertical; height: 80px; }
    .btn-simpan { width: 100%; background-color: #4a86e8; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-simpan:disabled { background-color: #9cbdf0; cursor: not-allowed; }
    .footer { margin-top: 15px; text-align: center; font-size: 12px; color: #888; background: #f9f9f9; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>📋 Input Jadwal Rapat</h2>
    <div class="subtitle">Notifikasi email H-1 akan dikirim otomatis setiap jam 7 pagi.</div>

    <form id="formRapat" onsubmit="prosesSimpan(event)">
      <div class="form-group">
        <label>Judul Rapat <span>*</span></label>
        <input type="text" id="judul" required placeholder="Contoh: Rapat Evaluasi Bulanan">
      </div>
      <div class="form-group">
        <label>Tanggal <span>*</span></label>
        <input type="date" id="tanggal" required>
      </div>
      <div class="form-group">
        <label>Jam <span>*</span></label>
        <input type="time" id="jam" required>
      </div>
      <div class="form-group">
        <label>Email Atasan <span>*</span></label>
        <input type="email" id="email" required placeholder="atasan@gmail.com">
      </div>
      <div class="form-group">
        <label>Deskripsi / Agenda</label>
        <textarea id="deskripsi" placeholder="Tuliskan agenda rapat..."></textarea>
      </div>
      <button type="submit" id="btnSimpan" class="btn-simpan">Simpan Jadwal</button>
    </form>
    <div class="footer">⏰ Scheduler aktif: Cek otomatis setiap pagi jam 07:00</div>
  </div>

  <script>
    function prosesSimpan(e) {
      e.preventDefault(); // Tahan form agar tidak reload

      var tombol = document.getElementById("btnSimpan");
      tombol.innerHTML = "⏳ Menyimpan...";
      tombol.disabled = true;

      var dataForm = {
        judul: document.getElementById("judul").value,
        tanggal: document.getElementById("tanggal").value,
        jam: document.getElementById("jam").value,
        email: document.getElementById("email").value,
        deskripsi: document.getElementById("deskripsi").value
      };

      // Kirim ke server
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            alert("✅ " + response.message);
            document.getElementById("formRapat").reset();
          } else {
            // Jika server menolak karena ada error (misal nama sheet salah)
            alert("❌ GAGAL: " + response.message);
          }
          tombol.innerHTML = "Simpan Jadwal";
          tombol.disabled = false;
        })
        .withFailureHandler(function(error) {
          // Jika koneksi terputus / script crash total
          alert("❌ ERROR SISTEM: " + error.message);
          tombol.innerHTML = "Simpan Jadwal";
          tombol.disabled = false;
        })
        .simpanJadwalKeSheet(dataForm);
    }
  </script>
</body>
</html>
