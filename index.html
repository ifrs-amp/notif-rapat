<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Rapat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #f4f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      padding: 32px 28px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 20, 30, 0.12);
      transition: 0.25s ease;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #0b2b40;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subhead {
      color: #5b6f82;
      font-size: 14px;
      margin-bottom: 24px;
      border-left: 4px solid #3b82f6;
      padding-left: 14px;
      background: #f8faff;
      border-radius: 4px;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      font-weight: 600;
      font-size: 13px;
      color: #1e3a5f;
      display: block;
      margin-bottom: 5px;
    }
    label span {
      color: #ef4444;
      margin-left: 2px;
    }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dce5ef;
      border-radius: 12px;
      font-size: 14px;
      background: #fafcff;
      transition: 0.2s;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .hint {
      font-size: 12px;
      color: #7a8a9e;
      margin-top: 5px;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #1a5cff;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-submit:hover {
      background: #0d4cdb;
      transform: scale(1.01);
      box-shadow: 0 10px 25px rgba(26, 92, 255, 0.25);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    #statusMessage {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 500;
      display: none;
    }
    .success {
      display: block !important;
      background: #e6f7e6;
      color: #0a6b2a;
      border: 1px solid #b2e0b2;
    }
    .error {
      display: block !important;
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ffcdd2;
    }
    .badge-info {
      display: inline-block;
      background: #eef2f6;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 12px;
      color: #2c3e50;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 Input Jadwal Rapat</h2>
    <div class="subhead">Notifikasi email H-1 akan dikirim otomatis setiap jam 7 pagi.</div>
    
    <form id="meetingForm" onsubmit="submitForm(event)">
      <div class="form-group">
        <label>Judul Rapat <span>*</span></label>
        <input type="text" id="title" placeholder="Contoh: Rapat Evaluasi Q3" required>
      </div>

      <div class="form-group">
        <label>Tanggal <span>*</span></label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label>Jam <span>*</span></label>
        <input type="time" id="time" required>
      </div>

      <div class="form-group">
        <label>Email Peserta <span>*</span></label>
        <input type="text" id="participants" placeholder="email1@domain.com, email2@domain.com" required>
        <div class="hint">Pisahkan lebih dari 1 email dengan tanda koma ( , )</div>
      </div>

      <div class="form-group">
        <label>Deskripsi / Agenda</label>
        <textarea id="description" placeholder="Bahasan utama rapat..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>📌</span> Simpan Jadwal
      </button>
    </form>

    <div id="statusMessage"></div>
    <div class="badge-info">⏰ Scheduler aktif: Cek otomatis setiap pagi jam 07:00</div>
  </div>

  <script>
    function submitForm(e) {
      e.preventDefault();
      
      const title = document.getElementById('title').value.trim();
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const participants = document.getElementById('participants').value.trim();
      const description = document.getElementById('description').value.trim();
      const btn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('statusMessage');
      
      if (!title || !date || !time || !participants) {
        statusDiv.className = 'error';
        statusDiv.textContent = '⚠️ Harap isi semua field wajib (Judul, Tanggal, Jam, Peserta).';
        statusDiv.style.display = 'block';
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '⏳ Menyimpan...';
      statusDiv.style.display = 'none';
      
      google.script.run
        .withSuccessHandler(function(response) {
          btn.disabled = false;
          btn.innerHTML = '📌 Simpan Jadwal';
          if (response.status === 'success') {
            statusDiv.className = 'success';
            statusDiv.textContent = response.message;
            document.getElementById('meetingForm').reset();
            statusDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            statusDiv.className = 'error';
            statusDiv.textContent = response.message;
          }
          statusDiv.style.display = 'block';
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = '📌 Simpan Jadwal';
          statusDiv.className = 'error';
          statusDiv.textContent = '❌ Terjadi kesalahan: ' + err.message;
          statusDiv.style.display = 'block';
        })
        .addMeeting(title, date, time, participants, description);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').setAttribute('min', today);
    });
  </script>
</body>
</html>
